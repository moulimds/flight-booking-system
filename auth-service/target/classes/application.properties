# Server Configuration
server.port=8081

# Application Name
spring.application.name=auth-service

# Database Configuration (MySQL)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/authen_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:BOOMI}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

# JWT Application Properties
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-1234567890
app.jwt.expiration-minutes=60
