# ===================================================================
# Eureka Discovery Server Configuration
# ===================================================================
server.port=8761

# Application Name
spring.application.name=eureka-server

# Eureka Server Standalone Settings
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Eureka Server Internals
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=4000

# Spring Cloud Config Client Settings
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false

# Common Security / JWT Secret Key
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-1234567890

# Management & Actuator Endpoints
management.endpoints.web.exposure.include=health,info
