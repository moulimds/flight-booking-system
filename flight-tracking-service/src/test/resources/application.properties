server.port=8086
spring.application.name=flight-tracking-service

# H2 In-Memory Database for Unit and Integration Testing
spring.datasource.url=jdbc:h2:mem:flight_tracking_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Eureka during test execution
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
