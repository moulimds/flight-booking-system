# Server Configuration (Dedicated Port 8095 to prevent any conflict with seat-service on 8086)
server.port=8095

# Spring Application Name
spring.application.name=flight-tracking-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/flight_tracking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=BOOMI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Discovery Configuration (Configurable - defaults to disabled for standalone testing)
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_REGISTER:false}
eureka.client.fetch-registry=${EUREKA_FETCH:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Flight Service URL
flight.service.url=http://localhost:8082/api/flights
