<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>✈️ SkyWings | Premium Flight Booking & Live Radar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/icons/skywings-icon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <!-- Google Identity Services (GIS) SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"Space Mono"', 'monospace']
          },
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>
  <script>
    try {
      if (localStorage.getItem('skywings_theme') === 'dark') {
        document.documentElement.classList.add('dark-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-[#F4F7FB] text-slate-800 antialiased selection:bg-blue-500 selection:text-white min-h-screen">
  <app-root></app-root>
</body>
</html>
