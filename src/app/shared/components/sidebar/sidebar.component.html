<aside class="sidebar-layout p-6 flex flex-col justify-between h-full bg-white border-r border-slate-200 min-h-screen">
  <div>
    <!-- Brand Logo -->
    <div class="flex items-center gap-3 mb-10 px-2 cursor-pointer" routerLink="/">
      <img src="assets/icons/skywings-icon.svg" alt="SkyWings Logo" class="w-10 h-10 rounded-2xl shadow-md shadow-blue-500/25 object-cover" />
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-slate-900">Sky<span class="text-blue-600">Wings</span></h1>
        <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">Airlines Suite</p>
      </div>
    </div>

    <!-- Navigation Links -->
    <nav class="space-y-1.5">
      <a routerLink="/flights/dashboard" routerLinkActive="active-nav" class="nav-item">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span>Flights</span>
      </a>

      <a routerLink="/tickets/my-tickets" routerLinkActive="active-nav" class="nav-item">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
        </svg>
        <span>My Bookings</span>
      </a>

      <a routerLink="/tracking/live-radar" routerLinkActive="active-nav" class="nav-item">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span>Flight Radar</span>
      </a>

      <a routerLink="/support" routerLinkActive="active-nav" class="nav-item">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span>Customer Support</span>
      </a>

      <!-- Admin & Staff Operations Dashboard -->
      <a *ngIf="authService.isStaff" [routerLink]="authService.isAdmin ? '/admin/dashboard' : (authService.isSupport ? '/support/console' : (authService.isAirportAdmin ? '/airport/console' : '/aircraft/console'))" routerLinkActive="active-nav" class="nav-item bg-amber-50 text-amber-800 hover:bg-amber-100">
        <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="font-bold">{{ authService.isAdmin ? 'Admin Console' : (authService.isSupport ? 'Support Console' : (authService.isAirportAdmin ? 'Airport Console' : 'Fleet Console')) }}</span>
      </a>
    </nav>
  </div>

  <!-- Bottom Settings & Logout -->
  <div class="border-t border-slate-200 pt-4 space-y-1">
    <a routerLink="/profile" routerLinkActive="active-nav" class="nav-item">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span>My Profile</span>
    </a>

    <button *ngIf="authService.isAuthenticated" (click)="authService.logout()" class="nav-item text-rose-600 hover:bg-rose-50 w-full text-left">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>
</aside>
