<header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-40">
  <!-- Search input -->
  <div class="relative w-80">
    <input type="text"
           placeholder="Search flights, routes, airports..."
           class="w-full bg-slate-50 border border-slate-200 rounded-full py-2.5 pl-11 pr-4 text-xs font-medium text-slate-700 focus:outline-none focus:border-blue-600 focus:bg-white transition-all shadow-sm">
    <svg class="w-4 h-4 text-slate-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
  </div>

  <!-- Right Action Items -->
  <div class="flex items-center gap-5">
    <!-- Live Flight Radar Status Pill -->
    <a routerLink="/tracking/live-radar" class="hidden md:flex items-center gap-2 px-3 py-1.5 bg-blue-50 border border-blue-200 text-blue-700 text-xs font-bold rounded-full hover:bg-blue-100 transition-colors">
      <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
      Live Radar
    </a>

    <!-- Customer Support Page Link Pill -->
    <a routerLink="/support" routerLinkActive="bg-emerald-100 text-emerald-800 border-emerald-400"
       class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold rounded-full hover:bg-emerald-100 transition-all shadow-2xs">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>💬 Customer Support</span>
    </a>

    <!-- Theme Toggle Pill -->
    <button (click)="themeService.toggleTheme()"
            type="button"
            [title]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-slate-200 hover:bg-slate-100 cursor-pointer text-xs font-semibold text-slate-700 transition-all">
      <span *ngIf="themeService.isDark(); else moonIcon" class="flex items-center gap-1 text-amber-500 font-bold">
        ☀️ <span class="hidden sm:inline">Light</span>
      </span>
      <ng-template #moonIcon>
        <span class="flex items-center gap-1 text-slate-600 font-bold">
          🌙 <span class="hidden sm:inline">Dark</span>
        </span>
      </ng-template>
    </button>

    <!-- User Profile Pill -->
    <div class="relative" (appClickOutside)="isProfileOpen = false">
      <div *ngIf="authService.currentUser$ | async as user; else loginButton"
           (click)="isProfileOpen = !isProfileOpen"
           class="flex items-center gap-3 p-1.5 pr-3 rounded-full hover:bg-slate-50 border border-slate-200/60 cursor-pointer transition-all">
        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xs uppercase shadow-sm">
          {{ (user.fullName || user.email || 'U').substring(0, 2) }}
        </div>
        <div class="text-left hidden sm:block">
          <span class="block text-xs font-bold text-slate-800 leading-none">{{ user.fullName || user.email }}</span>
          <span class="text-[10px] text-slate-400 font-semibold uppercase">{{ user.role }}</span>
        </div>
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>

      <ng-template #loginButton>
        <a routerLink="/auth/login" class="btn btn-primary btn-sm">
          Sign In
        </a>
      </ng-template>

      <!-- Dropdown Menu -->
      <div *ngIf="isProfileOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50 animate-fade-in">
        <a routerLink="/profile" (click)="isProfileOpen = false" class="block px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">
          My Profile & Passport
        </a>
        <a routerLink="/tickets/my-tickets" (click)="isProfileOpen = false" class="block px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">
          My Bookings
        </a>
        <div *ngIf="authService.isAdmin" class="border-t border-slate-100 my-1"></div>
        <a *ngIf="authService.isAdmin" routerLink="/admin/dashboard" (click)="isProfileOpen = false" class="block px-4 py-2 text-xs font-bold text-blue-600 hover:bg-blue-50">
          Admin Dashboard
        </a>
        <div class="border-t border-slate-100 my-1"></div>
        <button (click)="authService.logout(); isProfileOpen = false" class="w-full text-left px-4 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50">
          Sign Out
        </button>
      </div>
    </div>
  </div>
</header>
