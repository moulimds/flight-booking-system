<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  <div *ngFor="let toast of (toastService.toasts$ | async)"
       class="pointer-events-auto p-4 rounded-xl shadow-xl flex items-start gap-3 transition-all transform duration-300 animate-slide-in"
       [ngClass]="{
         'bg-emerald-50 border border-emerald-200 text-emerald-900': toast.type === 'success',
         'bg-rose-50 border border-rose-200 text-rose-900': toast.type === 'error',
         'bg-blue-50 border border-blue-200 text-blue-900': toast.type === 'info',
         'bg-amber-50 border border-amber-200 text-amber-900': toast.type === 'warning'
       }">
    
    <div class="flex-shrink-0 mt-0.5">
      <svg *ngIf="toast.type === 'success'" class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      <svg *ngIf="toast.type === 'error'" class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
      <svg *ngIf="toast.type === 'info'" class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <svg *ngIf="toast.type === 'warning'" class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>

    <div class="flex-1">
      <h4 class="text-sm font-bold">{{ toast.title }}</h4>
      <p class="text-xs mt-0.5 opacity-90">{{ toast.message }}</p>
    </div>

    <button (click)="toastService.remove(toast.id)" class="text-slate-400 hover:text-slate-600">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
