<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="skywingsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="wingGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Modern Rounded Icon Base -->
  <rect width="100" height="100" rx="22" fill="url(#skywingsGrad)"/>
  
  <!-- Dynamic Contrail / Vapor Trail Curves -->
  <path d="M14 78 Q 48 84 86 44" stroke="rgba(255, 255, 255, 0.28)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M22 84 Q 52 88 84 56" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Swept-Wing Supersonic Aircraft Ascending -->
  <g transform="translate(14, 14) scale(0.72)">
    <!-- Aerodynamic Jet Body & Delta Wings -->
    <path d="M50 6 L59 34 L96 54 L62 57 L65 82 L50 73 L35 82 L38 57 L4 54 L41 34 Z" 
          fill="#FFFFFF" 
          filter="url(#softShadow)"/>
    <!-- Fuselage Core -->
    <path d="M50 14 L55 36 L55 68 L50 72 L45 68 L45 36 Z" fill="url(#wingGlow)"/>
    <!-- Wing Accent Highlights -->
    <path d="M50 36 L86 52" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M50 36 L14 52" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="24" r="2.5" fill="#1e40af"/>
  </g>
</svg>
