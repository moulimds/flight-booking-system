version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: flight_mysql
    environment:
      MYSQL_ROOT_PASSWORD: BOOMI
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: flight_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URI=http://localhost:8761/eureka/

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - MYSQL_URL=jdbc:mysql://mysql:3306/authen_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - MYSQL_USER=root
      - MYSQL_PASSWORD=BOOMI
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql
      - rabbitmq

  checkin-service:
    build: ./checkin-service
    container_name: checkin-service
    ports:
      - "8082:8082"
    environment:
      - MYSQL_URL=jdbc:mysql://mysql:3306/checkin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - MYSQL_USER=root
      - MYSQL_PASSWORD=BOOMI
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql
      - rabbitmq

volumes:
  mysql_data:
