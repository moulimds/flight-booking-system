# =========================================================
# Server Configuration
# =========================================================
server.port=8082


# =========================================================
# Spring Application
# =========================================================
spring.application.name=fare-service


# =========================================================
# MySQL Database Configuration
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sindhu@07}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / Hibernate Configuration
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# RabbitMQ Configuration
# =========================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}


# =========================================================
# RabbitMQ Listener Retry
# =========================================================
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# =========================================================
# RabbitMQ Topology
# =========================================================

# Exchange
flight.rabbitmq.exchange=flight.booking.exchange


# =========================================================
# RabbitMQ Routing Keys
# =========================================================
flight.rabbitmq.routing-key.fare-validate=fare.validate
flight.rabbitmq.routing-key.fare-response=fare.validation.response
flight.rabbitmq.routing-key.fare-created=fare.created
flight.rabbitmq.routing-key.fare-updated=fare.updated
flight.rabbitmq.routing-key.fare-status-changed=fare.status.changed


# =========================================================
# RabbitMQ Queues
# =========================================================
flight.rabbitmq.queue.fare-validate=fare.validation.queue


# =========================================================
# Dead Letter Exchange / Queue
# =========================================================
flight.rabbitmq.dlx=flight.booking.dlx
flight.rabbitmq.dlq=flight.booking.dlq


# =========================================================
# Actuator Configuration
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# =========================================================
# SpringDoc / Swagger Configuration
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

spring.config.import=optional:configserver:http://localhost:8888
# =========================================================
# Eureka Client Configuration
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
