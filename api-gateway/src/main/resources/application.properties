# Server Configuration
server.port=8080

# Application Name
spring.application.name=api-gateway

# Spring Cloud Gateway Routes Configuration
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/users/**

spring.cloud.gateway.routes[1].id=checkin-service
spring.cloud.gateway.routes[1].uri=lb://checkin-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/checkin/**

spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=lb://booking-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/booking/**

spring.cloud.gateway.routes[3].id=flight-service
spring.cloud.gateway.routes[3].uri=lb://flight-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/flights/**, /api/search/**

# Eureka Discovery Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# JWT Application Secret Key
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-1234567890

# Spring Cloud Config Server Configuration
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.enabled=false
