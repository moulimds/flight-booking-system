# ===================================================================
# Spring Cloud API Gateway Configuration
# ===================================================================
server.port=8080

# Application Identity
spring.application.name=api-gateway

# Spring Cloud Config Client Settings
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false

# Common Security / JWT Secret Key
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-1234567890

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Gateway Dynamic Routing
# Route 0: Seat Service Operations & Inventory
spring.cloud.gateway.routes[0].id=seat-service-route
spring.cloud.gateway.routes[0].uri=lb://SEAT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/seats/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=seatServiceCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/seat

# Route 1: Notification Service Operations & Event Simulation
spring.cloud.gateway.routes[1].id=notification-service-route
spring.cloud.gateway.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=notificationServiceCircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/notification

# Route 2: Seat Service Swagger OpenAPI Docs
spring.cloud.gateway.routes[2].id=seat-service-docs
spring.cloud.gateway.routes[2].uri=lb://SEAT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/v3/api-docs/seat-service
spring.cloud.gateway.routes[2].filters[0]=SetPath=/v3/api-docs

# Route 3: Notification Service Swagger OpenAPI Docs
spring.cloud.gateway.routes[3].id=notification-service-docs
spring.cloud.gateway.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/notification-service
spring.cloud.gateway.routes[3].filters[0]=SetPath=/v3/api-docs

# Eureka Client Discovery Registration
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# RabbitMQ Connection Details
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Resilience4j Circuit Breakers Configuration
resilience4j.circuitbreaker.instances.seatServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.seatServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.seatServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.seatServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.seatServiceCircuitBreaker.wait-duration-in-open-state=5000ms
resilience4j.circuitbreaker.instances.seatServiceCircuitBreaker.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.wait-duration-in-open-state=5000ms
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.failure-rate-threshold=50

# Resilience4j Time Limiters Configuration
resilience4j.timelimiter.instances.seatServiceCircuitBreaker.timeout-duration=4000ms
resilience4j.timelimiter.instances.notificationServiceCircuitBreaker.timeout-duration=4000ms

# Swagger & OpenAPI UI Aggregation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=1. Seat Service API
springdoc.swagger-ui.urls[0].url=/v3/api-docs/seat-service
springdoc.swagger-ui.urls[1].name=2. Notification Service API
springdoc.swagger-ui.urls[1].url=/v3/api-docs/notification-service

# Management & Actuator Endpoints
management.endpoints.web.exposure.include=health,info,gateway,metrics
management.endpoint.gateway.enabled=true
